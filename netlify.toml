# Netlify settings for the public website (boosterbench.com).
[build]
  publish = "."
  command = "echo 'Static site, nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/faq"
  to = "/help.html"
  status = 301

# The web version of the app lives in /app (built from the boosterbench-app repo with
# `npm run build:web`). Any /app address opens the app, which then shows the right screen.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Keep the app's sign-in pages out of search results.
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex"
